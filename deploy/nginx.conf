# /etc/nginx/sites-available/english-path
# Then: ln -s ../sites-available/english-path /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d english.example.com

server {
    listen 80;
    server_name english.example.com;

    client_max_body_size 4m;   # drawing canvas uploads
    server_tokens off;         # don't advertise the nginx version

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the app trusts the last address only
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI answers are streamed (Server-Sent Events) — don't buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
